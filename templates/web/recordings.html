<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recordings &middot; pyca-orchestrator</title>
  {% include "_favicon.html" %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ static_url('style.css') }}" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main-content">Skip to main content</a>

  {% with active="recordings" %}{% include "_navbar.html" %}{% endwith %}

  <main id="main-content" class="container-fluid pb-5">
    <header class="page-header">
      <div>
        <h1 class="page-title">Recordings</h1>
        <p class="page-subtitle" id="retention-note"></p>
      </div>
      <div class="page-actions">
        <button id="refresh-btn" type="button" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-clockwise refresh-icon" aria-hidden="true"></i> Refresh
        </button>
      </div>
    </header>

    <!-- Summary of every recording on disk, whatever the table's filters show. -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <span class="stat-icon bg-secondary-subtle text-secondary-emphasis" aria-hidden="true"><i class="bi bi-camera-video"></i></span>
            <div class="min-w-0">
              <div class="text-secondary small text-uppercase">Recordings</div>
              <div class="stat-value" id="stat-recordings">&ndash;</div>
              <div class="text-secondary small" id="stat-recordings-sub"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card h-100" id="stat-not-ingested-card">
          <div class="card-body d-flex align-items-center gap-3">
            <span class="stat-icon bg-secondary-subtle text-secondary-emphasis" id="stat-not-ingested-chip" aria-hidden="true"><i class="bi bi-cloud-check" id="stat-not-ingested-icon"></i></span>
            <div class="min-w-0">
              <div class="text-secondary small text-uppercase">Not ingested</div>
              <div class="stat-value" id="stat-not-ingested">&ndash;</div>
              <div class="text-secondary small" id="stat-not-ingested-sub"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <span class="stat-icon bg-info-subtle text-info-emphasis" aria-hidden="true"><i class="bi bi-device-hdd"></i></span>
            <div class="min-w-0">
              <div class="text-secondary small text-uppercase">Storage</div>
              <div class="stat-value" id="stat-storage">&ndash;</div>
              <div class="text-secondary small" id="stat-storage-sub"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <span class="stat-icon bg-secondary-subtle text-secondary-emphasis" aria-hidden="true"><i class="bi bi-trash3"></i></span>
            <div class="min-w-0">
              <div class="text-secondary small text-uppercase">Deleted in next 24h</div>
              <div class="stat-value" id="stat-expiring">&ndash;</div>
              <div class="text-secondary small" id="stat-expiring-sub"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header bg-body toolbar">
        <form id="recording-filters" class="d-flex flex-wrap align-items-center gap-2 toolbar-row toolbar-row-filters">
          <i class="bi bi-funnel text-secondary" aria-hidden="true" title="Filter recordings"></i>
          <label for="filter-venue" class="visually-hidden">Filter by venue</label>
          <select id="filter-venue" name="venue" class="form-select form-select-sm toolbar-filter">
            <option value="">All venues</option>
          </select>
          <label for="filter-status" class="visually-hidden">Filter by ingest status</label>
          <select id="filter-status" name="status" class="form-select form-select-sm toolbar-filter">
            <option value="">All statuses</option>
            <option value="ingested">Ingested</option>
            <option value="not-ingested">Not ingested</option>
            <option value="in-progress">In progress</option>
          </select>
          <span id="recording-count" class="text-secondary"></span>
          <button type="button" id="clear-filters-btn" class="btn btn-link btn-sm text-decoration-none d-none ms-auto">
            <i class="bi bi-x-circle" aria-hidden="true"></i> Clear
          </button>
        </form>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="recordings-table">
            <thead>
              <tr>
                <th scope="col">Recorded</th>
                <th scope="col">Venue</th>
                <th scope="col" class="d-none d-sm-table-cell">Status</th>
                <th scope="col" class="d-none d-xl-table-cell">Size</th>
                <th scope="col">Keep for<span class="d-sm-none"> (days)</span></th>
                <th scope="col" class="d-none d-sm-table-cell">Deleted</th>
                <th scope="col" class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="recordings-body">
              <tr class="skeleton-row"><td colspan="7"><span class="placeholder-glow"><span class="placeholder col-8"></span></span></td></tr>
              <tr class="skeleton-row"><td colspan="7"><span class="placeholder-glow"><span class="placeholder col-6"></span></span></td></tr>
            </tbody>
          </table>
        </div>
        <div id="recordings-pagination" class="table-pagination d-none"></div>
        <div id="recordings-message" class="text-center text-secondary py-5 d-none" role="status"></div>
      </div>
    </div>
  </main>

  <!-- Confirm dialog (reused for destructive actions) -->
  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-modal-label">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="confirm-modal-label">
            <i class="bi bi-exclamation-triangle me-2" id="confirm-modal-icon" aria-hidden="true"></i><span id="confirm-modal-title-text">Confirm</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="confirm-modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-modal-accept">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ static_url('common.js') }}"></script>
  <script src="{{ static_url('recordings.js') }}"></script>
</body>
</html>
