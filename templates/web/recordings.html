<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recordings &middot; pyca-orchestrator</title>
  {% include "_favicon.html" %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ static_url('style.css') }}" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main-content">Skip to main content</a>

  {% with active="recordings" %}{% include "_navbar.html" %}{% endwith %}

  <main id="main-content" class="container-fluid pb-5">
    <div class="card">
      <div class="card-header bg-body toolbar">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 toolbar-row">
          <div class="d-flex flex-wrap align-items-baseline gap-3">
            <h1 class="h5 mb-0">Recordings</h1>
            <span id="retention-note" class="text-secondary small"></span>
          </div>
          <button id="refresh-btn" type="button" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-clockwise refresh-icon" aria-hidden="true"></i> Refresh
          </button>
        </div>
        <form id="recording-filters" class="d-flex flex-wrap align-items-center gap-2 toolbar-row toolbar-row-filters">
          <i class="bi bi-funnel text-secondary" aria-hidden="true" title="Filter recordings"></i>
          <label for="filter-venue" class="visually-hidden">Filter by venue</label>
          <select id="filter-venue" name="venue" class="form-select form-select-sm toolbar-filter">
            <option value="">All venues</option>
          </select>
          <label for="filter-status" class="visually-hidden">Filter by ingest status</label>
          <select id="filter-status" name="status" class="form-select form-select-sm toolbar-filter">
            <option value="">All statuses</option>
            <option value="ingested">Ingested</option>
            <option value="not-ingested">Not ingested</option>
            <option value="in-progress">In progress</option>
          </select>
          <span id="recording-count" class="text-secondary"></span>
          <button type="button" id="clear-filters-btn" class="btn btn-link btn-sm text-decoration-none d-none ms-auto">
            <i class="bi bi-x-circle" aria-hidden="true"></i> Clear
          </button>
        </form>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="recordings-table">
            <thead>
              <tr>
                <th scope="col">Recorded</th>
                <th scope="col">Venue</th>
                <th scope="col">Status</th>
                <th scope="col" class="d-none d-md-table-cell">Size</th>
                <th scope="col">Keep for</th>
                <th scope="col" class="d-none d-sm-table-cell">Deleted</th>
                <th scope="col" class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="recordings-body">
              <tr class="skeleton-row"><td colspan="7"><span class="placeholder-glow"><span class="placeholder col-8"></span></span></td></tr>
              <tr class="skeleton-row"><td colspan="7"><span class="placeholder-glow"><span class="placeholder col-6"></span></span></td></tr>
            </tbody>
          </table>
        </div>
        <div id="recordings-message" class="text-center text-secondary py-5 d-none" role="status"></div>
      </div>
    </div>
  </main>

  <!-- Confirm dialog (reused for destructive actions) -->
  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-modal-label">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="confirm-modal-label">
            <i class="bi bi-exclamation-triangle me-2" id="confirm-modal-icon" aria-hidden="true"></i><span id="confirm-modal-title-text">Confirm</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="confirm-modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-modal-accept">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ static_url('common.js') }}"></script>
  <script src="{{ static_url('recordings.js') }}"></script>
</body>
</html>
