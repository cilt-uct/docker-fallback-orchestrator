<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit log &middot; pyca-orchestrator</title>
  {% include "_favicon.html" %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ static_url('style.css') }}" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main-content">Skip to main content</a>

  {% with active="audit" %}{% include "_navbar.html" %}{% endwith %}

  <main id="main-content" class="container-fluid pb-5">
    <div class="card">
      <div class="card-header bg-body toolbar">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 toolbar-row">
          <h1 class="h5 mb-0">Audit log</h1>
          <button id="refresh-btn" type="button" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-clockwise refresh-icon" aria-hidden="true"></i> Refresh
          </button>
        </div>
        <form id="audit-filters" class="d-flex flex-wrap align-items-center gap-2 toolbar-row toolbar-row-filters">
          <i class="bi bi-funnel text-secondary" aria-hidden="true" title="Filter events"></i>
          <label for="filter-venue" class="visually-hidden">Filter by exact venue name</label>
          <div class="input-group input-group-sm toolbar-search">
            <span class="input-group-text" aria-hidden="true"><i class="bi bi-search"></i></span>
            <input id="filter-venue" name="venue" type="search" class="form-control" placeholder="Exact venue name&hellip;" autocomplete="off">
          </div>
          <label for="filter-action" class="visually-hidden">Filter by action</label>
          <select id="filter-action" name="action" class="form-select form-select-sm toolbar-filter">
            <option value="">All actions</option>
            <option value="instance.create">Created</option>
            <option value="instance.start">Started</option>
            <option value="instance.stop">Stopped</option>
            <option value="instance.restart">Restarted</option>
            <option value="instance.delete">Deleted</option>
            <option value="instance.rtsp_source_changed">RTSP source changed</option>
            <option value="instance.teardown_deferred">Teardown deferred</option>
          </select>
          <label for="filter-actor" class="visually-hidden">Filter by actor</label>
          <select id="filter-actor" name="actor_type" class="form-select form-select-sm toolbar-filter">
            <option value="">All actors</option>
            <option value="operator">Operator</option>
            <option value="system">System</option>
          </select>
          <label for="filter-outcome" class="visually-hidden">Filter by outcome</label>
          <select id="filter-outcome" name="outcome" class="form-select form-select-sm toolbar-filter">
            <option value="">All outcomes</option>
            <option value="success">Succeeded</option>
            <option value="failure">Failed</option>
          </select>
          <button type="button" id="clear-filters-btn" class="btn btn-link btn-sm text-decoration-none d-none ms-auto">
            <i class="bi bi-x-circle" aria-hidden="true"></i> Clear
          </button>
        </form>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="audit-table">
            <thead>
              <tr>
                <th scope="col">When</th>
                <th scope="col">Action</th>
                <th scope="col">Venue / Agent</th>
                <th scope="col" class="d-none d-md-table-cell">Actor</th>
                <th scope="col" class="d-none d-md-table-cell">Details</th>
              </tr>
            </thead>
            <tbody id="audit-body">
              <tr class="skeleton-row"><td colspan="5"><span class="placeholder-glow"><span class="placeholder col-8"></span></span></td></tr>
              <tr class="skeleton-row"><td colspan="5"><span class="placeholder-glow"><span class="placeholder col-6"></span></span></td></tr>
            </tbody>
          </table>
        </div>
        <div id="audit-message" class="text-center text-secondary py-5 d-none" role="status"></div>
        <div class="text-center py-3 d-none" id="load-more-wrap">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="load-more-btn">Load older events</button>
        </div>
      </div>
    </div>
  </main>

  <script src="{{ static_url('common.js') }}"></script>
  <script src="{{ static_url('audit.js') }}"></script>
</body>
</html>
